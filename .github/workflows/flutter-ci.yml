name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Generate android/ folder if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.ibrahimshoshaa .
          fi

      - name: Add notifications permission to AndroidManifest
        run: |
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Set app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Tahoun Royal Home"/' android/app/src/main/AndroidManifest.xml

      - name: Apply custom app icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "assets/icon/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "assets/icon/mipmap-$density/ic_launcher_round.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true

      - name: Apply custom Android build config
        run: |
          cp android-config/app_build.gradle.kts android/app/build.gradle.kts
          sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts

      - name: Insert google-services.json
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          else
            echo "firebase/google-services.json is missing"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build universal release APK
        run: flutter build apk --release --no-shrink

      # نتأكد أن الملف APK سليم كـ ZIP وأنه APK موقع وقابل للتحقق.
      - name: Validate release APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "APK SHA256:"
          sha256sum "$APK"

      # نحذف الأصول القديمة من الـ Release الثابت حتى لا تختار APK قديم بالخطأ.
      - name: Remove old APK assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-apk >/dev/null 2>&1 || exit 0
          for asset in app-debug.apk app-release.apk workshop-manager.apk; do
            gh release delete-asset latest-apk "$asset" --yes >/dev/null 2>&1 || true
          done

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "آخر نسخة APK"
          body: "آخر بناء ناجح من الفرع ${{ github.ref_name }} - كوميت ${{ github.sha }}"
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
