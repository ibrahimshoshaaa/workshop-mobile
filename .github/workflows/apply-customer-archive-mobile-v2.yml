name: Apply Professional Customer Archive (Mobile)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[archive-mobile-done]') && !contains(github.event.head_commit.message, '[archive-mobile-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply professional archive implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)

          # ---------------- Models ----------------
          p = 'lib/models/customer_model.dart'
          s = read(p)
          if 'final bool isArchived;' not in s:
              s = s.replace('  final DateTime createdAt;\n', '  final DateTime createdAt;\n  final bool isArchived;\n  final DateTime? archivedAt;\n  final int? archiveYear;\n', 1)
              s = s.replace('    required this.createdAt,\n  });', '    required this.createdAt,\n    this.isArchived = false,\n    this.archivedAt,\n    this.archiveYear,\n  });', 1)
              s = s.replace("      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n", "      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n      isArchived: map['isArchived'] == true,\n      archivedAt: (map['archivedAt'] as num?) == null ? null : DateTime.fromMillisecondsSinceEpoch((map['archivedAt'] as num).toInt()),\n      archiveYear: (map['archiveYear'] as num?)?.toInt(),\n", 1)
              s = s.replace("      'createdAt': createdAt.millisecondsSinceEpoch,\n", "      'createdAt': createdAt.millisecondsSinceEpoch,\n      'isArchived': isArchived,\n      if (archivedAt != null) 'archivedAt': archivedAt!.millisecondsSinceEpoch,\n      if (archiveYear != null) 'archiveYear': archiveYear,\n", 1)
              s = s.replace('      createdAt: createdAt,\n    );', '      createdAt: createdAt,\n      isArchived: isArchived,\n      archivedAt: archivedAt,\n      archiveYear: archiveYear,\n    );', 1)
          write(p, s)

          p = 'lib/models/order_model.dart'
          s = read(p)
          if 'final bool isArchived;' not in s:
              s = s.replace('  final DateTime createdAt;\n', '  final DateTime createdAt;\n  final bool isArchived;\n  final DateTime? archivedAt;\n  final int? archiveYear;\n', 1)
              s = s.replace('    required this.createdAt,\n  });', '    required this.createdAt,\n    this.isArchived = false,\n    this.archivedAt,\n    this.archiveYear,\n  });', 1)
              s = s.replace("      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n", "      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n      isArchived: map['isArchived'] == true,\n      archivedAt: (map['archivedAt'] as num?) == null ? null : DateTime.fromMillisecondsSinceEpoch((map['archivedAt'] as num).toInt()),\n      archiveYear: (map['archiveYear'] as num?)?.toInt(),\n", 1)
              s = s.replace("      'createdAt': createdAt.millisecondsSinceEpoch,\n", "      'createdAt': createdAt.millisecondsSinceEpoch,\n      'isArchived': isArchived,\n      if (archivedAt != null) 'archivedAt': archivedAt!.millisecondsSinceEpoch,\n      if (archiveYear != null) 'archiveYear': archiveYear,\n", 1)
              s = s.replace('      createdAt: createdAt,\n    );', '      createdAt: createdAt,\n      isArchived: isArchived,\n      archivedAt: archivedAt,\n      archiveYear: archiveYear,\n    );', 1)
          write(p, s)

          # ---------------- Firebase service ----------------
          p = 'lib/services/firebase_service.dart'
          s = read(p)
          if 'Stream<List<CustomerModel>> streamArchivedCustomers' not in s:
              pattern = re.escape('  Stream<List<CustomerModel>> streamCustomers() {') + r'.*?\n  }\n'
              m = re.search(pattern, s, re.S)
              if not m: raise SystemExit('streamCustomers marker not found')
              replacement = '''  Stream<List<CustomerModel>> streamCustomers() {
    return _customers.onValue.map((event) => _mapSnapshotToList(
          event.snapshot,
          CustomerModel.fromMap,
        ).where((c) => !c.isArchived).toList()
          ..sort((a, b) => b.createdAt.compareTo(a.createdAt)));
  }

  Stream<List<CustomerModel>> streamArchivedCustomers({int? year}) {
    return _customers.onValue.map((event) => _mapSnapshotToList(
          event.snapshot,
          CustomerModel.fromMap,
        ).where((c) => c.isArchived && (year == null || c.archiveYear == year)).toList()
          ..sort((a, b) => (b.archivedAt ?? b.createdAt).compareTo(a.archivedAt ?? a.createdAt)));
  }

  Future<String?> getCustomerArchiveBlockReason(String customerId) async {
    try {
      final snapshot = await _orders.orderByChild('customerId').equalTo(customerId).get().timeout(_writeTimeout);
      for (final child in snapshot.children) {
        if (child.value is! Map) continue;
        final order = OrderModel.fromMap(child.key!, Map<dynamic, dynamic>.from(child.value as Map));
        if (order.remainingAmount > 0.01) {
          return 'لا يمكن الأرشفة: على العميل ${order.remainingAmount.toStringAsFixed(0)} جنيه متبقي';
        }
        if (order.status != 'تم التسليم') {
          return 'لا يمكن الأرشفة: يوجد طلب غير مُسلّم (${order.itemType})';
        }
      }
      return null;
    } catch (_) {
      return 'تعذر التحقق من حالة طلبات العميل حاليًا';
    }
  }

  Future<void> archiveCustomer(String customerId) async {
    final reason = await getCustomerArchiveBlockReason(customerId);
    if (reason != null) throw StateError(reason);

    final now = _now;
    final year = DateTime.now().year;
    final ordersSnapshot = await _orders.orderByChild('customerId').equalTo(customerId).get().timeout(_writeTimeout);
    final updates = <String, dynamic>{
      'customers/$customerId/isArchived': true,
      'customers/$customerId/archivedAt': now,
      'customers/$customerId/archiveYear': year,
      'customers/$customerId/updatedAt': now,
    };

    for (final child in ordersSnapshot.children) {
      updates['orders/${child.key}/isArchived'] = true;
      updates['orders/${child.key}/archivedAt'] = now;
      updates['orders/${child.key}/archiveYear'] = year;
      updates['orders/${child.key}/updatedAt'] = now;
    }

    await _write(() => _db.ref().update(updates));
  }

  Stream<List<OrderModel>> streamArchivedOrders({int? year, String? customerId}) {
    return _orders.onValue.map((event) => _mapSnapshotToList(
          event.snapshot,
          OrderModel.fromMap,
        ).where((o) => o.isArchived &&
            (year == null || o.archiveYear == year) &&
            (customerId == null || o.customerId == customerId)).toList()
          ..sort((a, b) => b.createdAt.compareTo(a.createdAt)));
  }
'''
              s = s[:m.start()] + replacement + s[m.end():]

          pattern = re.escape('  Stream<List<OrderModel>> streamOrders() {') + r'.*?\n  }\n'
          m = re.search(pattern, s, re.S)
          if not m: raise SystemExit('streamOrders marker not found')
          if '.where((o) => !o.isArchived)' not in m.group(0):
              replacement = '''  Stream<List<OrderModel>> streamOrders() {
    return _orders.onValue.map((event) => _mapSnapshotToList(
          event.snapshot,
          OrderModel.fromMap,
        ).where((o) => !o.isArchived).toList()
          ..sort((a, b) => b.createdAt.compareTo(a.createdAt)));
  }
'''
              s = s[:m.start()] + replacement + s[m.end():]
          write(p, s)

          # ---------------- Providers ----------------
          p = 'lib/providers/app_providers.dart'
          s = read(p)
          if 'archivedCustomersStreamProvider' not in s:
              marker = '''final ordersForCustomerProvider =
    StreamProvider.family<List<OrderModel>, String>((ref, customerId) {
  return ref.watch(firebaseServiceProvider).streamOrdersForCustomer(customerId);
});
'''
              if marker not in s: raise SystemExit('ordersForCustomerProvider marker not found')
              addition = marker + '''
final archivedCustomersStreamProvider = StreamProvider<List<CustomerModel>>((ref) {
  return ref.watch(firebaseServiceProvider).streamArchivedCustomers();
});

final archivedOrdersStreamProvider = StreamProvider<List<OrderModel>>((ref) {
  return ref.watch(firebaseServiceProvider).streamArchivedOrders();
});
'''
              s = s.replace(marker, addition, 1)

          # Cache must obey the same active/archive boundary.
          s = s.replace("yield cached.entries.map((e) => CustomerModel.fromMap(e.key, e.value)).toList();", "yield cached.entries.map((e) => CustomerModel.fromMap(e.key, e.value)).where((c) => !c.isArchived).toList();", 1)
          s = s.replace("yield cached.entries.map((e) => OrderModel.fromMap(e.key, e.value)).toList();", "yield cached.entries.map((e) => OrderModel.fromMap(e.key, e.value)).where((o) => !o.isArchived).toList();", 1)
          write(p, s)

          # ---------------- Customer detail ----------------
          p = 'lib/screens/customers/customer_detail_screen.dart'
          s = read(p)
          if "import '../../core/auth_state.dart';" not in s:
              s = s.replace("import '../../core/theme/app_theme.dart';", "import '../../core/theme/app_theme.dart';\nimport '../../core/auth_state.dart';", 1)
          if "Icons.archive_outlined" not in s:
              marker = """          IconButton(\n            icon: const Icon(Icons.edit_outlined),\n"""
              # Insert archive immediately after edit button block by anchoring the delete button.
              delete_marker = """          IconButton(\n              icon: const Icon(Icons.delete_outline_rounded),\n"""
              archive = """          if (AuthState.isAdmin)\n            IconButton(\n              icon: const Icon(Icons.archive_outlined),\n              tooltip: 'أرشفة العميل',\n              onPressed: () async {\n                final service = ref.read(firebaseServiceProvider);\n                final reason = await service.getCustomerArchiveBlockReason(customerId);\n                if (!context.mounted) return;\n                if (reason != null) {\n                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(reason)));\n                  return;\n                }\n                final confirmed = await showDialog<bool>(\n                  context: context,\n                  builder: (dialogContext) => AlertDialog(\n                    title: const Text('أرشفة العميل'),\n                    content: const Text('سيتم أرشفة العميل وكل طلباته المكتملة في أرشيف السنة الحالية. البيانات لن تُحذف.'),\n                    actions: [\n                      TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('إلغاء')),\n                      FilledButton(onPressed: () => Navigator.pop(dialogContext, true), child: const Text('أرشفة')),\n                    ],\n                  ),\n                );\n                if (confirmed != true) return;\n                try {\n                  await service.archiveCustomer(customerId);\n                  if (context.mounted) {\n                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تمت أرشفة العميل وطلباته بنجاح')));\n                    context.pop();\n                  }\n                } catch (e) {\n                  if (context.mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString().replaceFirst('Bad state: ', ''))));\n                }\n              },\n            ),\n"""
              if delete_marker not in s: raise SystemExit('customer delete marker not found')
              s = s.replace(delete_marker, archive + delete_marker, 1)
          write(p, s)

          # ---------------- Router ----------------
          p = 'lib/core/router/app_router.dart'
          s = read(p)
          if "customer_archive_screen.dart" not in s:
              s = s.replace("import '../../screens/customers/customer_detail_screen.dart';", "import '../../screens/customers/customer_detail_screen.dart';\nimport '../../screens/customers/customer_archive_screen.dart';", 1)
          s = s.replace("if (location.startsWith('/settings') && !AuthState.isAdmin)", "if ((location.startsWith('/settings') || location.startsWith('/customer-archive')) && !AuthState.isAdmin)", 1)
          if "path: '/customer-archive'" not in s:
              marker = """          GoRoute(\n            path: '/orders',\n"""
              route = """          GoRoute(\n            path: '/customer-archive',\n            builder: (context, state) => const CustomerArchiveScreen(),\n          ),\n          GoRoute(\n            path: '/orders',\n"""
              if marker not in s: raise SystemExit('router orders marker not found')
              s = s.replace(marker, route, 1)
          write(p, s)

          # ---------------- Root shell ----------------
          p = 'lib/screens/root_shell.dart'
          s = read(p)
          if "('/customer-archive'" not in s:
              marker = "    ('/reports', Icons.bar_chart_rounded, 'التقارير', 'reports'),\n"
              if marker not in s: raise SystemExit('root shell reports marker not found')
              s = s.replace(marker, marker + "    ('/customer-archive', Icons.archive_rounded, 'أرشيف العملاء', 'admin'),\n", 1)
          s = s.replace("final items = _moreItems.where((m) => AuthState.can(m.$4)).toList();", "final items = _moreItems.where((m) => m.$4 == 'admin' ? AuthState.isAdmin : AuthState.can(m.$4)).toList();", 1)
          s = s.replace("return _moreItems.any((m) => AuthState.can(m.$4));", "return _moreItems.any((m) => m.$4 == 'admin' ? AuthState.isAdmin : AuthState.can(m.$4));", 1)
          write(p, s)

          # ---------------- Professional archive screen ----------------
          archive = r'''import 'package:flutter/material.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import '../../core/theme/app_theme.dart';
import '../../models/order_model.dart';
import '../../providers/app_providers.dart';

class CustomerArchiveScreen extends ConsumerStatefulWidget {
  const CustomerArchiveScreen({super.key});

  @override
  ConsumerState<CustomerArchiveScreen> createState() => _CustomerArchiveScreenState();
}

class _CustomerArchiveScreenState extends ConsumerState<CustomerArchiveScreen> {
  final _searchController = TextEditingController();
  int? _selectedYear;

  @override
  void dispose() {
    _searchController.dispose();
    super.dispose();
  }

  void _showOrderDetails(BuildContext context, OrderModel order) {
    showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      showDragHandle: true,
      builder: (context) => SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(20, 4, 20, 24),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Text(order.itemType, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
              const SizedBox(height: 12),
              _DetailRow(label: 'الحالة', value: order.status),
              _DetailRow(label: 'الإجمالي', value: '${(order.totalAmount - order.discountAmount).toStringAsFixed(0)} جنيه'),
              _DetailRow(label: 'المدفوع', value: '${order.totalPaid.toStringAsFixed(0)} جنيه'),
              _DetailRow(label: 'الخصم', value: '${order.discountAmount.toStringAsFixed(0)} جنيه'),
              if (order.details.trim().isNotEmpty) ...[
                const SizedBox(height: 8),
                const Text('تفاصيل الطلب', style: TextStyle(fontWeight: FontWeight.bold)),
                const SizedBox(height: 4),
                Text(order.details),
              ],
            ],
          ),
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    final customers = ref.watch(archivedCustomersStreamProvider).value ?? const [];
    final orders = ref.watch(archivedOrdersStreamProvider).value ?? const [];
    final query = _searchController.text.trim();

    final years = customers.map((c) => c.archiveYear).whereType<int>().toSet().toList()
      ..sort((a, b) => b.compareTo(a));

    final filteredCustomers = customers.where((c) {
      final yearOk = _selectedYear == null || c.archiveYear == _selectedYear;
      final searchOk = query.isEmpty ||
          c.name.toLowerCase().contains(query.toLowerCase()) ||
          c.phone.contains(query) ||
          c.serialNumber.toString() == query;
      return yearOk && searchOk;
    }).toList();

    final customerIds = filteredCustomers.map((c) => c.id).toSet();
    final visibleOrders = orders.where((o) => customerIds.contains(o.customerId)).toList();
    final totalValue = visibleOrders.fold<double>(0, (sum, o) => sum + o.totalAmount - o.discountAmount);
    final totalPaid = visibleOrders.fold<double>(0, (sum, o) => sum + o.totalPaid);

    return Scaffold(
      appBar: AppBar(title: const Text('أرشيف العملاء')),
      body: RefreshIndicator(
        onRefresh: () async {
          ref.invalidate(archivedCustomersStreamProvider);
          ref.invalidate(archivedOrdersStreamProvider);
        },
        child: ListView(
          padding: const EdgeInsets.fromLTRB(16, 12, 16, 24),
          children: [
            TextField(
              controller: _searchController,
              onChanged: (_) => setState(() {}),
              decoration: InputDecoration(
                hintText: 'بحث بالاسم أو الهاتف أو الرقم التسلسلي',
                prefixIcon: const Icon(Icons.search_rounded),
                suffixIcon: query.isEmpty ? null : IconButton(
                  icon: const Icon(Icons.clear_rounded),
                  onPressed: () { _searchController.clear(); setState(() {}); },
                ),
              ),
            ),
            if (years.isNotEmpty) ...[
              const SizedBox(height: 12),
              SizedBox(
                height: 40,
                child: ListView(
                  scrollDirection: Axis.horizontal,
                  children: [
                    ChoiceChip(
                      label: const Text('كل السنوات'),
                      selected: _selectedYear == null,
                      onSelected: (_) => setState(() => _selectedYear = null),
                    ),
                    const SizedBox(width: 8),
                    ...years.map((year) => Padding(
                      padding: const EdgeInsets.only(right: 8),
                      child: ChoiceChip(
                        label: Text('أرشيف $year'),
                        selected: _selectedYear == year,
                        onSelected: (_) => setState(() => _selectedYear = year),
                      ),
                    )),
                  ],
                ),
              ),
            ],
            const SizedBox(height: 16),
            Row(
              children: [
                Expanded(child: _StatCard(icon: Icons.people_alt_rounded, label: 'العملاء', value: '${filteredCustomers.length}')),
                const SizedBox(width: 8),
                Expanded(child: _StatCard(icon: Icons.receipt_long_rounded, label: 'الطلبات', value: '${visibleOrders.length}')),
              ],
            ),
            const SizedBox(height: 8),
            Row(
              children: [
                Expanded(child: _StatCard(icon: Icons.payments_rounded, label: 'إجمالي الطلبات', value: '${totalValue.toStringAsFixed(0)} جنيه')),
                const SizedBox(width: 8),
                Expanded(child: _StatCard(icon: Icons.account_balance_wallet_rounded, label: 'إجمالي المدفوع', value: '${totalPaid.toStringAsFixed(0)} جنيه')),
              ],
            ),
            const SizedBox(height: 20),
            if (filteredCustomers.isEmpty)
              const Padding(
                padding: EdgeInsets.symmetric(vertical: 48),
                child: Center(child: Text('لا توجد بيانات مؤرشفة مطابقة للبحث', style: TextStyle(color: Colors.grey))),
              )
            else
              ...filteredCustomers.map((customer) {
                final customerOrders = visibleOrders.where((o) => o.customerId == customer.id).toList();
                return Card(
                  margin: const EdgeInsets.only(bottom: 10),
                  clipBehavior: Clip.antiAlias,
                  child: ExpansionTile(
                    leading: CircleAvatar(
                      backgroundColor: AppColors.wood.withValues(alpha: 0.12),
                      child: Text('${customer.serialNumber}', style: const TextStyle(color: AppColors.wood, fontWeight: FontWeight.bold)),
                    ),
                    title: Text(customer.name, style: const TextStyle(fontWeight: FontWeight.bold)),
                    subtitle: Text('${customer.phone} • ${customerOrders.length} طلب'),
                    children: customerOrders.isEmpty
                        ? [const ListTile(title: Text('لا توجد طلبات محفوظة لهذا العميل'))]
                        : customerOrders.map((order) => ListTile(
                            leading: const Icon(Icons.receipt_long_outlined),
                            title: Text(order.itemType),
                            subtitle: Text('${(order.totalAmount - order.discountAmount).toStringAsFixed(0)} جنيه • ${order.status}'),
                            trailing: const Icon(Icons.chevron_left_rounded),
                            onTap: () => _showOrderDetails(context, order),
                          )).toList(),
                  ),
                );
              }),
          ],
        ),
      ),
    );
  }
}

class _StatCard extends StatelessWidget {
  final IconData icon;
  final String label;
  final String value;
  const _StatCard({required this.icon, required this.label, required this.value});

  @override
  Widget build(BuildContext context) {
    return Card(
      child: Padding(
        padding: const EdgeInsets.all(12),
        child: Row(
          children: [
            Icon(icon, color: AppColors.wood, size: 22),
            const SizedBox(width: 8),
            Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(label, style: const TextStyle(fontSize: 11, color: Colors.grey)), const SizedBox(height: 3), Text(value, style: const TextStyle(fontWeight: FontWeight.bold))])),
          ],
        ),
      ),
    );
  }
}

class _DetailRow extends StatelessWidget {
  final String label;
  final String value;
  const _DetailRow({required this.label, required this.value});

  @override
  Widget build(BuildContext context) => Padding(
    padding: const EdgeInsets.symmetric(vertical: 4),
    child: Row(children: [Text('$label: ', style: const TextStyle(fontWeight: FontWeight.bold)), Expanded(child: Text(value))]),
  );
}
