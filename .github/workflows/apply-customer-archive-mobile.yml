name: Apply Customer Archive (Mobile)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[archive-mobile-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply archive changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)
          def replace_once(p, old, new):
              s = read(p)
              if old not in s:
                  raise SystemExit(f'Marker not found in {p}: {old[:120]}')
              write(p, s.replace(old, new, 1))

          # Customer model
          p='lib/models/customer_model.dart'
          s=read(p)
          s=s.replace('  final DateTime createdAt;\n', '  final DateTime createdAt;\n  final bool isArchived;\n  final DateTime? archivedAt;\n  final int? archiveYear;\n')
          s=s.replace('    required this.createdAt,\n', '    required this.createdAt,\n    this.isArchived = false,\n    this.archivedAt,\n    this.archiveYear,\n')
          s=s.replace("      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n", "      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n      isArchived: map['isArchived'] == true,\n      archivedAt: (map['archivedAt'] as num?) != null ? DateTime.fromMillisecondsSinceEpoch((map['archivedAt'] as num).toInt()) : null,\n      archiveYear: (map['archiveYear'] as num?)?.toInt(),\n")
          s=s.replace("      'createdAt': createdAt.millisecondsSinceEpoch,\n", "      'createdAt': createdAt.millisecondsSinceEpoch,\n      'isArchived': isArchived,\n      if (archivedAt != null) 'archivedAt': archivedAt!.millisecondsSinceEpoch,\n      if (archiveYear != null) 'archiveYear': archiveYear,\n")
          s=s.replace('    int? serialNumber,\n  }) {', '    int? serialNumber,\n  }) {')
          s=s.replace('      createdAt: createdAt,\n    );\n', '      createdAt: createdAt,\n      isArchived: isArchived,\n      archivedAt: archivedAt,\n      archiveYear: archiveYear,\n    );\n')
          write(p,s)

          # Order model
          p='lib/models/order_model.dart'
          s=read(p)
          s=s.replace('  final DateTime createdAt;\n', '  final DateTime createdAt;\n  final bool isArchived;\n  final DateTime? archivedAt;\n  final int? archiveYear;\n')
          s=s.replace('    required this.createdAt,\n  });', '    required this.createdAt,\n    this.isArchived = false,\n    this.archivedAt,\n    this.archiveYear,\n  });')
          s=s.replace("      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n", "      createdAt: DateTime.fromMillisecondsSinceEpoch(\n        (map['createdAt'] as num?)?.toInt() ?? DateTime.now().millisecondsSinceEpoch,\n      ),\n      isArchived: map['isArchived'] == true,\n      archivedAt: (map['archivedAt'] as num?) != null ? DateTime.fromMillisecondsSinceEpoch((map['archivedAt'] as num).toInt()) : null,\n      archiveYear: (map['archiveYear'] as num?)?.toInt(),\n")
          s=s.replace("      'createdAt': createdAt.millisecondsSinceEpoch,\n", "      'createdAt': createdAt.millisecondsSinceEpoch,\n      'isArchived': isArchived,\n      if (archivedAt != null) 'archivedAt': archivedAt!.millisecondsSinceEpoch,\n      if (archiveYear != null) 'archiveYear': archiveYear,\n")
          s=s.replace('      createdAt: createdAt,\n    );\n', '      createdAt: createdAt,\n      isArchived: isArchived,\n      archivedAt: archivedAt,\n      archiveYear: archiveYear,\n    );\n')
          write(p,s)

          # Firebase service: active streams exclude archive + archive APIs.
          p='lib/services/firebase_service.dart'
          s=read(p)
          old="""  Stream<List<CustomerModel>> streamCustomers() {\n    return _customers.onValue.map((event) => _mapSnapshotToList(\n          event.snapshot,\n          CustomerModel.fromMap,\n        )..sort((a, b) => b.createdAt.compareTo(a.createdAt)));\n  }\n"""
          new="""  Stream<List<CustomerModel>> streamCustomers() {\n    return _customers.onValue.map((event) => _mapSnapshotToList(\n          event.snapshot,\n          CustomerModel.fromMap,\n        ).where((c) => !c.isArchived).toList()..sort((a, b) => b.createdAt.compareTo(a.createdAt)));\n  }\n\n  Stream<List<CustomerModel>> streamArchivedCustomers({int? year}) {\n    return _customers.onValue.map((event) => _mapSnapshotToList(\n          event.snapshot,\n          CustomerModel.fromMap,\n        ).where((c) => c.isArchived && (year == null || c.archiveYear == year)).toList()\n          ..sort((a, b) => (b.archivedAt ?? b.createdAt).compareTo(a.archivedAt ?? a.createdAt)));\n  }\n\n  Future<String?> getCustomerArchiveBlockReason(String customerId) async {\n    try {\n      final snapshot = await _orders.orderByChild('customerId').equalTo(customerId).get().timeout(_writeTimeout);\n      for (final child in snapshot.children) {\n        final order = OrderModel.fromMap(child.key!, Map<dynamic, dynamic>.from(child.value as Map));\n        if (order.remainingAmount > 0.01) return 'العميل عليه ${order.remainingAmount.toStringAsFixed(0)} جنيه متبقي';\n        if (order.status != 'تم التسليم') return 'يوجد طلب غير مُسلّم (${order.itemType})';\n      }\n      return null;\n    } catch (_) {\n      return 'تعذر التحقق من الطلبات حاليًا';\n    }\n  }\n\n  Future<void> archiveCustomer(String customerId) async {\n    final reason = await getCustomerArchiveBlockReason(customerId);\n    if (reason != null) throw Exception(reason);\n    final now = _now;\n    final year = DateTime.now().year;\n    final snapshot = await _orders.orderByChild('customerId').equalTo(customerId).get().timeout(_writeTimeout);\n    final updates = <String, dynamic>{\n      'customers/$customerId/isArchived': true,\n      'customers/$customerId/archivedAt': now,\n      'customers/$customerId/archiveYear': year,\n      'customers/$customerId/updatedAt': now,\n    };\n    for (final child in snapshot.children) {\n      updates['orders/${child.key}/isArchived'] = true;\n      updates['orders/${child.key}/archivedAt'] = now;\n      updates['orders/${child.key}/archiveYear'] = year;\n      updates['orders/${child.key}/updatedAt'] = now;\n    }\n    await _write(() => _db.ref().update(updates));\n  }\n\n  Stream<List<OrderModel>> streamArchivedOrders({int? year, String? customerId}) {\n    return _orders.onValue.map((event) => _mapSnapshotToList(\n          event.snapshot,\n          OrderModel.fromMap,\n        ).where((o) => o.isArchived && (year == null || o.archiveYear == year) && (customerId == null || o.customerId == customerId)).toList()\n          ..sort((a, b) => b.createdAt.compareTo(a.createdAt)));\n  }\n"""
          replace_once(p,old,new)
          old="""  Stream<List<OrderModel>> streamOrders() {\n    return _orders.onValue.map((event) => _mapSnapshotToList(\n          event.snapshot,\n          OrderModel.fromMap,\n        )..sort((a, b) => b.createdAt.compareTo(a.createdAt)));\n  }\n"""
          new="""  Stream<List<OrderModel>> streamOrders() {\n    return _orders.onValue.map((event) => _mapSnapshotToList(\n          event.snapshot,\n          OrderModel.fromMap,\n        ).where((o) => !o.isArchived).toList()..sort((a, b) => b.createdAt.compareTo(a.createdAt)));\n  }\n"""
          replace_once(p,old,new)
          write(p,s)

          # Providers
          p='lib/providers/app_providers.dart'
          s=read(p)
          marker="""final ordersForCustomerProvider =\n    StreamProvider.family<List<OrderModel>, String>((ref, customerId) {\n  return ref.watch(firebaseServiceProvider).streamOrdersForCustomer(customerId);\n});\n"""
          addition=marker+"""\nfinal archivedCustomersStreamProvider = StreamProvider<List<CustomerModel>>((ref) {\n  return ref.watch(firebaseServiceProvider).streamArchivedCustomers();\n});\n\nfinal archivedOrdersStreamProvider = StreamProvider<List<OrderModel>>((ref) {\n  return ref.watch(firebaseServiceProvider).streamArchivedOrders();\n});\n"""
          replace_once(p,marker,addition)
          write(p,s)

          # Customer detail: admin archive action.
          p='lib/screens/customers/customer_detail_screen.dart'
          s=read(p)
          marker="""          IconButton(\n            icon: const Icon(Icons.delete_outline_rounded),\n"""
          archive="""          if (AuthState.isAdmin)\n            IconButton(\n              icon: const Icon(Icons.archive_outlined),\n              tooltip: 'أرشفة العميل',\n              onPressed: () async {\n                final reason = await ref.read(firebaseServiceProvider).getCustomerArchiveBlockReason(customerId);\n                if (!context.mounted) return;\n                if (reason != null) {\n                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(reason)));\n                  return;\n                }\n                final confirm = await showDialog<bool>(\n                  context: context,\n                  builder: (context) => AlertDialog(\n                    title: const Text('أرشفة العميل'),\n                    content: const Text('سيتم نقل العميل وكل طلباته المكتملة إلى أرشيف السنة الحالية. البيانات لن تُحذف.'),\n                    actions: [\n                      TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('إلغاء')),\n                      ElevatedButton(onPressed: () => Navigator.pop(context, true), child: const Text('أرشفة')),\n                    ],\n                  ),\n                );\n                if (confirm != true) return;\n                try {\n                  await ref.read(firebaseServiceProvider).archiveCustomer(customerId);\n                  if (context.mounted) {\n                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تمت أرشفة العميل وطلباته بنجاح')));\n                    context.pop();\n                  }\n                } catch (e) {\n                  if (context.mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تعذر الأرشفة: $e')));\n                }\n              },\n            ),\n          IconButton(\n            icon: const Icon(Icons.delete_outline_rounded),\n"""
          replace_once(p,marker,archive)
          s=s.replace("import '../../core/theme/app_theme.dart';", "import '../../core/theme/app_theme.dart';\nimport '../../core/auth_state.dart';")
          write(p,s)

          # Router + admin guard.
          p='lib/core/router/app_router.dart'
          s=read(p)
          s=s.replace("import '../../screens/customers/customer_detail_screen.dart';", "import '../../screens/customers/customer_detail_screen.dart';\nimport '../../screens/customers/customer_archive_screen.dart';")
          s=s.replace("      if (location.startsWith('/settings') && !AuthState.isAdmin) {", "      if ((location.startsWith('/settings') || location.startsWith('/customer-archive')) && !AuthState.isAdmin) {")
          marker="""          GoRoute(\n            path: '/orders',\n"""
          archive_route="""          GoRoute(\n            path: '/customer-archive',\n            builder: (context, state) => const CustomerArchiveScreen(),\n          ),\n          GoRoute(\n            path: '/orders',\n"""
          replace_once(p,marker,archive_route)
          write(p,s)

          # Root shell: admin-only archive in More menu.
          p='lib/screens/root_shell.dart'
          s=read(p)
          marker="""    ('/reports', Icons.bar_chart_rounded, 'التقارير', 'reports'),\n"""
          repl=marker+"    ('/customer-archive', Icons.archive_rounded, 'أرشيف العملاء', 'admin'),\n"
          replace_once(p,marker,repl)
          # AuthState.can doesn't have an admin pseudo-permission; filter it explicitly.
          s=s.replace("    final items = _moreItems.where((m) => AuthState.can(m.$4)).toList();", "    final items = _moreItems.where((m) => m.$4 == 'admin' ? AuthState.isAdmin : AuthState.can(m.$4)).toList();")
          s=s.replace("            return _moreItems.any((m) => AuthState.can(m.$4));", "            return _moreItems.any((m) => m.$4 == 'admin' ? AuthState.isAdmin : AuthState.can(m.$4));")
          write(p,s)

          # Archive screen
          Path('lib/screens/customers/customer_archive_screen.dart').write_text(r'''import 'package:flutter/material.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:go_router/go_router.dart';
import '../../providers/app_providers.dart';
import '../../models/customer_model.dart';
import '../../core/theme/app_theme.dart';

class CustomerArchiveScreen extends ConsumerStatefulWidget {
  const CustomerArchiveScreen({super.key});

  @override
  ConsumerState<CustomerArchiveScreen> createState() => _CustomerArchiveScreenState();
}

class _CustomerArchiveScreenState extends ConsumerState<CustomerArchiveScreen> {
  final _search = TextEditingController();
  int? _year;

  @override
  void dispose() { _search.dispose(); super.dispose(); }

  @override
  Widget build(BuildContext context) {
    final customers = ref.watch(archivedCustomersStreamProvider).value ?? [];
    final orders = ref.watch(archivedOrdersStreamProvider).value ?? [];
    final years = customers.map((c) => c.archiveYear).whereType<int>().toSet().toList()..sort((a,b)=>b.compareTo(a));
    final q = _search.text.trim();
    final filtered = customers.where((c) => (_year == null || c.archiveYear == _year) &&
      (q.isEmpty || c.name.contains(q) || c.phone.contains(q) || c.serialNumber.toString() == q)).toList();
    final filteredIds = filtered.map((c)=>c.id).toSet();
    final visibleOrders = orders.where((o)=>filteredIds.contains(o.customerId)).toList();
    final total = visibleOrders.fold<double>(0,(s,o)=>s+o.totalAmount-o.discountAmount);
    final paid = visibleOrders.fold<double>(0,(s,o)=>s+o.totalPaid);

    return Scaffold(
      appBar: AppBar(title: const Text('أرشيف العملاء')),
      body: RefreshIndicator(
        onRefresh: () async => ref.invalidate(archivedCustomersStreamProvider),
        child: ListView(
          padding: const EdgeInsets.all(16),
          children: [
            TextField(controller: _search, onChanged: (_) => setState((){}), decoration: InputDecoration(hintText:'ابحث بالاسم أو الهاتف أو السيريال', prefixIcon:const Icon(Icons.search), suffixIcon: _search.text.isEmpty ? null : IconButton(onPressed:(){_search.clear();setState((){});},icon:const Icon(Icons.clear)), border:const OutlineInputBorder())),
            const SizedBox(height: 10),
            if (years.isNotEmpty) SingleChildScrollView(scrollDirection: Axis.horizontal, child: Row(children:[
              ChoiceChip(label:const Text('كل السنوات'), selected:_year==null, onSelected:(_)=>setState(()=>_year=null)),
              const SizedBox(width:8),
              ...years.map((y)=>Padding(padding:const EdgeInsets.only(left:8), child:ChoiceChip(label:Text('أرشيف $y'), selected:_year==y, onSelected:(_)=>setState(()=>_year=y)))),
            ])),
            const SizedBox(height:12),
            Row(children:[_stat('العملاء', '${filtered.length}'), _stat('الطلبات','${visibleOrders.length}'), _stat('قيمة الطلبات','${total.toStringAsFixed(0)} ج'), _stat('المدفوع','${paid.toStringAsFixed(0)} ج')]),
            const SizedBox(height:12),
            if (filtered.isEmpty) const Padding(padding:EdgeInsets.all(32), child:Center(child:Text('لا يوجد عملاء مؤرشفون'))),
            ...filtered.map((c)=>_customerCard(context,c,orders)),
          ],
        ),
      ),
    );
  }

  Widget _stat(String title,String value)=>Expanded(child:Card(child:Padding(padding:const EdgeInsets.all(10),child:Column(children:[Text(title,style:const TextStyle(fontSize:11,color:Colors.grey)),const SizedBox(height:4),Text(value,style:const TextStyle(fontWeight:FontWeight.bold,fontSize:13))]))));

  Widget _customerCard(BuildContext context, CustomerModel c, List orders) {
    final customerOrders = orders.where((o)=>o.customerId==c.id).toList();
    return Card(child:ExpansionTile(
      leading:CircleAvatar(backgroundColor:AppColors.wood.withValues(alpha:.1),child:Text(c.name.isEmpty?'?':c.name[0],style:const TextStyle(color:AppColors.wood))),
      title:Text(c.name,style:const TextStyle(fontWeight:FontWeight.bold)),
      subtitle:Text('${c.phone}  •  #${c.serialNumber}  •  ${customerOrders.length} طلب'),
      children: customerOrders.isEmpty ? [const ListTile(title:Text('لا توجد طلبات مؤرشفة'))] : customerOrders.map((o)=>ListTile(
        title:Text(o.itemType),
        subtitle:Text('${o.status} • إجمالي ${((o.totalAmount-o.discountAmount)).toStringAsFixed(0)} ج • مدفوع ${o.totalPaid.toStringAsFixed(0)} ج'),
        trailing:const Icon(Icons.chevron_left_rounded),
        onTap:()=>context.push('/orders/${o.id}'),
      )).toList(),
    ));
  }
}
''')
          PY

      - name: Format
        run: dart format lib

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/apply-customer-archive-mobile.yml
          git commit -m "Implement customer annual archive on mobile [archive-mobile-done]"
          git push
