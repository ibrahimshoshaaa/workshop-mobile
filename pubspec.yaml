name: workshop_mobile
description: "ورشة التنجيد والأثاث — تطبيق إدارة عملاء وطلبات ومديونيات (Flutter/Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management / routing ──
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # ── Firebase (Realtime Database + Auth) ──
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10

  # ── تخزين محلي (Cache-then-Network) ──
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.2
  shared_preferences: ^2.3.5

  # ── صور ──
  image_picker: ^1.1.2

  # ── إشعارات محلية ──
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1

  # ── مشاركة (نص + صور) ──
  share_plus: ^10.1.4
  http: ^1.2.2
  path_provider: ^2.1.5

  # ── PDF / Excel export ──
  pdf: ^3.11.3
  printing: ^5.13.4
  excel: ^4.0.6

  # ── واجهة ──
  google_fonts: ^6.2.1
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
